<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a8a6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>Trainingsplan</title>
<style>
:root {
  --bg: #f0f5f3;
  --card: #ffffff;
  --primary: #1a8a6a;
  --primary-dark: #147255;
  --primary-light: #e8f5f0;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e9e7;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 14px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --nav-height: 64px;
  --green-50: #e8f5f0;
  --green-100: #d1ede3;
  --amber: #f59e0b;
  --red: #ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

/* Header */
.header{background:var(--card);padding:16px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.header .sub{font-size:13px;color:var(--text-secondary);margin-top:2px}

/* Views */
.view{display:none;padding:16px 16px calc(var(--nav-height) + 16px);overflow-y:auto;flex:1}
.view.active{display:block}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform 0.1s}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-weight:600;font-size:15px;color:var(--text)}
.card-subtitle{font-size:12px;color:var(--text-secondary);margin-top:1px}

/* Week selector */
.week-selector{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.week-selector::-webkit-scrollbar{display:none}
.week-chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all 0.15s}
.week-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.week-chip.deload{border-color:var(--amber);color:var(--amber)}
.week-chip.active.deload{background:var(--amber);border-color:var(--amber);color:#fff}
.week-chip.test{border-color:var(--primary);border-style:dashed}
.week-chip.completed{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}

/* Exercise rows */
.exercise{padding:14px 0;border-bottom:1px solid var(--border)}
.exercise:last-child{border-bottom:none}
.exercise .top{display:flex;justify-content:space-between;align-items:flex-start}
.exercise .name{font-weight:600;font-size:15px}
.exercise .detail{font-size:13px;color:var(--text-secondary);margin-top:2px}
.exercise .badge{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--primary-light);color:var(--primary);font-weight:500;display:inline-block;margin-top:4px}
.exercise .badge.deload-badge{background:#fef3c7;color:#92400e}
.exercise .badge.test-badge{background:#dbeafe;color:#1e40af}

/* Weight input */
.weight-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.weight-input{width:80px;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-weight:600;text-align:center;outline:none;background:var(--bg);color:var(--text);transition:border-color 0.15s}
.weight-input:focus{border-color:var(--primary)}
.reps-input{width:52px;padding:8px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:600;text-align:center;outline:none;background:var(--bg);color:var(--text);transition:border-color 0.15s}
.reps-input:focus{border-color:var(--primary)}
.weight-unit{font-size:13px;color:var(--text-secondary);font-weight:500}
.lift-btn{padding:6px 14px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.lift-btn.primary{background:var(--primary);color:#fff}
.lift-btn.primary:active{background:var(--primary-dark)}
.lift-btn.saved{background:var(--green-100);color:var(--primary-dark)}
.set-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--text-secondary)}
.set-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.set-dot.done{background:var(--primary)}
.set-dot.skipped{background:var(--red)}

/* Stats cards */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-card .value{font-size:24px;font-weight:800;color:var(--primary)}
.stat-card .label{font-size:12px;color:var(--text-secondary);margin-top:2px}
.stat-card .sub-value{font-size:13px;color:var(--text-muted);margin-top:1px}

/* Progress chart area */
.progress-list{margin-top:8px}
.progress-item{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.progress-item .name{font-weight:600;font-size:14px}
.progress-item .weeks{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.progress-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--green-100);color:var(--primary);position:relative}
.progress-dot.highlight{background:var(--primary);color:#fff}
.progress-dot.empty{background:var(--border);color:var(--text-muted)}
.progress-dot .kg-label{position:absolute;top:-14px;font-size:9px;font-weight:400;color:var(--text-muted);white-space:nowrap}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;height:var(--nav-height);padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text-muted);transition:color 0.15s;padding:6px 0}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:22px;height:22px}
.nav-item span{font-size:11px;font-weight:500}

/* Progress detail modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;justify-content:center;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding:20px;animation:slideUp 0.2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:12px}
.modal-close{float:right;border:none;background:none;font-size:20px;color:var(--text-secondary);cursor:pointer}
.progress-bar{border:none;background:var(--bg);border-radius:4px;height:6px;width:100%;margin:4px 0}
.bar-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.bar-row:last-child{border-bottom:none}
.bar-row .w-label{font-size:12px;color:var(--text-secondary);width:60px}
.bar-row .w-val{font-size:14px;font-weight:600;width:50px;text-align:right}
.bar-fill{flex:1;margin:0 10px}

/* Empty state */
.empty-state{padding:40px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:0.4}
.empty-state p{font-size:14px}

/* Reset button */
.reset-btn{position:fixed;bottom:80px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;color:var(--text-muted);font-size:18px;transition:all 0.15s}
.reset-btn:active{transform:scale(0.92)}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:300;animation:toastIn 0.2s ease;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
</style>
</head>
<body>

<div class="header" id="header">
  <h1 id="pageTitle">Übersicht</h1>
  <div class="sub" id="pageSub">8-Wochen Kraftzyklus</div>
</div>

<!-- VIEW: Übersicht -->
<div class="view active" id="viewOverview">
  <div class="stats-grid" id="statsGrid"></div>
  <div class="card">
    <div class="card-title" style="margin-bottom:8px">Aktuelle Woche</div>
    <div id="overviewWeek"></div>
  </div>
  <div class="card" id="overviewNotes">
    <div class="card-title" style="margin-bottom:6px">Session-Aufbau</div>
    <div style="font-size:13px;color:var(--text-secondary);line-height:1.7">
      1. Warm-up (8-10 Min)<br>
      2. Explosive Pull-up / MU-Arbeit (~10 Min)<br>
      3. Kniebeuge – Hauptsätze (20-22 Min)<br>
      4. Bankdrücken – Hauptsätze (20-22 Min)<br>
      5. Strict Press (10-12 Min)<br>
      6. Grip-WOD (10-15 Min)
    </div>
  </div>
</div>

<!-- VIEW: Training -->
<div class="view" id="viewTraining">
  <div class="week-selector" id="weekSelector"></div>
  <div id="trainingContent"></div>
</div>

<!-- VIEW: Fortschritt -->
<div class="view" id="viewProgress">
  <div class="progress-list" id="progressList"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <div class="nav-item active" data-view="overview" onclick="switchView('overview')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Übersicht</span>
  </div>
  <div class="nav-item" data-view="training" onclick="switchView('training')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    <span>Training</span>
  </div>
  <div class="nav-item" data-view="progress" onclick="switchView('progress')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span>Fortschritt</span>
  </div>
</nav>

<button class="reset-btn" id="resetBtn" onclick="resetData()" title="Daten zurücksetzen">↺</button>

<script src="data.js"></script>
<script>
// ========== IndexedDB ==========
const DB_NAME = 'TrainingsPlan';
const DB_VER = 2;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('weights')) {
        const store = db.createObjectStore('weights', { keyPath: 'id' });
        store.createIndex('week', 'week', { unique: false });
        store.createIndex('exercise', 'exerciseId', { unique: false });
      }
      if (!db.objectStoreNames.contains('sets')) {
        db.createObjectStore('sets', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveWeight(weekId, exerciseId, weight, reps) {
  const db = await openDB();
  const tx = db.transaction('weights', 'readwrite');
  const store = tx.objectStore('weights');
  await store.put({ id: `${weekId}_${exerciseId}`, week: weekId, exerciseId, weight, reps, updatedAt: Date.now() });
  return new Promise(r => { tx.oncomplete = () => r(); });
}

async function loadAllWeights() {
  const db = await openDB();
  const tx = db.transaction('weights', 'readonly');
  const store = tx.objectStore('weights');
  return new Promise(r => {
    const req = store.getAll();
    req.onsuccess = () => r(req.result || []);
    req.onerror = () => r([]);
  });
}

async function getWeight(weekId, exerciseId) {
  const all = await loadAllWeights();
  return all.find(w => w.week === weekId && w.exerciseId === exerciseId);
}

async function saveSets(weekId, exerciseId, doneSets, totalSets) {
  const db = await openDB();
  const tx = db.transaction('sets', 'readwrite');
  const store = tx.objectStore('sets');
  await store.put({ id: `${weekId}_${exerciseId}`, week: weekId, exerciseId, doneSets, totalSets, updatedAt: Date.now() });
  return new Promise(r => { tx.oncomplete = () => r(); });
}

async function loadSets(weekId, exerciseId) {
  const db = await openDB();
  const tx = db.transaction('sets', 'readonly');
  const store = tx.objectStore('sets');
  return new Promise(r => {
    const req = store.get(`${weekId}_${exerciseId}`);
    req.onsuccess = () => r(req.result || null);
    req.onerror = () => r(null);
  });
}

async function loadAllSets() {
  const db = await openDB();
  const tx = db.transaction('sets', 'readonly');
  const store = tx.objectStore('sets');
  return new Promise(r => {
    const req = store.getAll();
    req.onsuccess = () => r(req.result || []);
    req.onerror = () => r([]);
  });
}

async function resetAllData() {
  const db = await openDB();
  const tx = db.transaction(['weights', 'sets'], 'readwrite');
  tx.objectStore('weights').clear();
  tx.objectStore('sets').clear();
  localStorage.removeItem('tp_current_week');
  return new Promise(r => { tx.oncomplete = () => r(); });
}

// ========== App State ==========
let currentView = 'overview';
let currentWeek = parseInt(localStorage.getItem('tp_current_week')) || 1;
let savedWeights = {};
let savedSets = {};

function determineCurrentWeek() {
  return currentWeek;
}

async function refreshData() {
  const weights = await loadAllWeights();
  savedWeights = {};
  weights.forEach(w => { savedWeights[`${w.week}_${w.exerciseId}`] = {weight: w.weight, reps: w.reps}; });
  const sets = await loadAllSets();
  savedSets = {};
  sets.forEach(s => { savedSets[`${s.week}_${s.exerciseId}`] = s; });
}

// ========== Router ==========
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`view${view.charAt(0).toUpperCase() + view.slice(1)}`).classList.add('active');
  document.querySelector(`.nav-item[data-view="${view}"]`).classList.add('active');
  const titles = { overview: 'Übersicht', training: 'Training', progress: 'Fortschritt' };
  document.getElementById('pageTitle').textContent = titles[view];
  render();
}

function render() {
  refreshData().then(() => {
    if (currentView === 'overview') renderOverview();
    else if (currentView === 'training') renderTraining();
    else if (currentView === 'progress') renderProgress();
  });
}

// ========== Overview ==========
function renderOverview() {
  const week = PLAN.weeks.find(w => w.id === currentWeek) || PLAN.weeks[0];
  // Stats
  const totalEx = week.exercises.length;
  const savedCount = week.exercises.filter(e => savedWeights[`${week.id}_${e.id}`]?.weight != null).length;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="value">${week.id}/8</div><div class="label">Aktuelle Woche</div></div>
    <div class="stat-card"><div class="value">${savedCount}/${totalEx}</div><div class="label">Gewichte notiert</div></div>
  `;
  // Week overview
  const exHtml = week.exercises.map(e => {
    const sw = savedWeights[`${week.id}_${e.id}`];
    const wgt = sw?.weight;
    const weightStr = wgt ? `${wgt} kg` : (e.weight ? `${e.weight} kg` : 'BW');
    return `<div class="exercise">
      <div class="top"><span class="name">${e.name}</span><span style="font-weight:600;color:var(--primary)">${e.sets}×${e.reps || '—'}</span></div>
      <div class="detail">${weightStr}${e.desc ? ' · ' + e.desc : ''}</div>
    </div>`;
  }).join('');
  document.getElementById('overviewWeek').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600;font-size:16px">${week.label}</span>
      <span style="font-size:12px;padding:3px 10px;border-radius:6px;background:${week.isDeload ? '#fef3c7' : week.isTest ? '#dbeafe' : 'var(--primary-light)'};color:${week.isDeload ? '#92400e' : week.isTest ? '#1e40af' : 'var(--primary)'}">${week.isDeload ? '🔄 Deload' : week.isTest ? '🧪 Test' : '🔴 Kraft'}</span>
    </div>
    ${exHtml}
    <div style="margin-top:12px;text-align:center"><button class="lift-btn primary" onclick="switchView('training')" style="padding:10px 24px">Zum Training →</button></div>
  `;
}

// ========== Training ==========
let trainingInitialized = false;

function renderTraining() {
  const sel = document.getElementById('weekSelector');
  if (!trainingInitialized) {
    sel.innerHTML = PLAN.weeks.map(w => {
      const ww = savedWeights;
      const done = w.exercises.every(e => ww[`${w.id}_${e.id}`]?.weight != null);
      let cls = 'week-chip';
      if (w.id === currentWeek) cls += ' active';
      if (w.isDeload) cls += ' deload';
      if (w.isTest) cls += ' test';
      if (done && w.id !== currentWeek) cls += ' completed';
      return `<div class="${cls}" data-week="${w.id}" onclick="selectWeek(${w.id})">${w.isDeload ? '🔄' : w.isTest ? '🧪' : 'W'}${w.id}</div>`;
    }).join('');
    trainingInitialized = true;
  }
  renderWeek(currentWeek);
}

function selectWeek(weekId) {
  currentWeek = weekId;
  localStorage.setItem('tp_current_week', weekId);
  document.querySelectorAll('.week-chip').forEach(c => c.classList.remove('active'));
  document.querySelector(`.week-chip[data-week="${weekId}"]`).classList.add('active');
  renderWeek(weekId);
  renderOverview();
}

async function renderWeek(weekId) {
  const week = PLAN.weeks.find(w => w.id === weekId);
  if (!week) return;
  const cont = document.getElementById('trainingContent');
  cont.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div><span style="font-weight:700;font-size:17px">${week.label}</span>${week.isDeload ? ' <span style="font-size:12px;color:var(--amber)">Deload</span>' : ''}${week.isTest ? ' <span style="font-size:12px;color:#1e40af">Test</span>' : ''}</div>
    <span style="font-size:12px;color:var(--text-secondary)">${week.exercises.length} Übungen</span>
  </div>`;

  for (const e of week.exercises) {
    const saved = savedWeights[`${week.id}_${e.id}`];
    const savedW = saved?.weight;
    const savedR = saved?.reps;
    const setData = savedSets[`${week.id}_${e.id}`] || { doneSets: 0, totalSets: e.sets || 0 };
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '10px';
    
    let badgeHtml = '';
    if (week.isDeload) badgeHtml = '<span class="badge deload-badge">Deload</span>';
    else if (week.isTest) badgeHtml = '<span class="badge test-badge">Test</span>';
    else if (e.isTopSet) badgeHtml = '<span class="badge">Top Set</span>';
    
    let setDots = '';
    const total = e.sets || 1;
    for (let i = 0; i < total; i++) {
      const done = i < setData.doneSets;
      setDots += `<div class="set-dot ${done ? 'done' : ''}" onclick="toggleSet(${week.id},'${e.id}',${total})"></div>`;
    }
    if (setData.doneSets === total && total > 0) {
      card.style.borderLeft = '3px solid var(--primary)';
    }

    card.innerHTML = `
      <div class="exercise" style="padding:0;border:none">
        <div class="top">
          <div><span class="name">${e.name}</span> ${badgeHtml}</div>
          <span style="font-weight:600;color:var(--primary)">${e.sets}×<span id="r_${week.id}_${e.id}_disp">${savedR || e.reps || '—'}</span></span>
        </div>
        <div class="detail">${e.desc || ''}${e.rest ? ' · Pause: ' + e.rest : ''}</div>
        <div class="weight-row">
          <input type="number" class="weight-input" id="w_${week.id}_${e.id}" value="${savedW || e.weight || ''}" placeholder="${e.weight || 0}" step="0.5" min="0" inputmode="decimal">
          <span class="weight-unit">kg</span>
          <span style="font-size:13px;color:var(--text-secondary);margin:0 2px">×</span>
          <input type="number" class="reps-input" id="r_${week.id}_${e.id}" value="${savedR || e.reps || ''}" placeholder="${e.reps || ''}" step="1" min="0" inputmode="numeric">
          <span class="weight-unit">WH</span>
          <button class="lift-btn ${savedW != null ? 'saved' : 'primary'}" id="b_${week.id}_${e.id}" onclick="saveEx(${week.id},'${e.id}')">${savedW != null ? '✓' : 'Speichern'}</button>
        </div>
        <div class="set-row">
          <span style="font-size:11px;color:var(--text-muted);margin-right:4px">Sätze:</span>
          ${setDots}
          <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${setData.doneSets}/${total}</span>
        </div>
      </div>`;
    cont.appendChild(card);
  }
}

async function saveEx(weekId, exerciseId) {
  const input = document.getElementById(`w_${weekId}_${exerciseId}`);
  const repsInput = document.getElementById(`r_${weekId}_${exerciseId}`);
  const disp = document.getElementById(`r_${weekId}_${exerciseId}_disp`);
  const btn = document.getElementById(`b_${weekId}_${exerciseId}`);
  const val = parseFloat(input.value);
  const reps = parseInt(repsInput.value);
  if (isNaN(val) || val <= 0) { showToast('Bitte gültiges Gewicht eingeben'); return; }
  await saveWeight(weekId, exerciseId, val, isNaN(reps) ? undefined : reps);
  savedWeights[`${weekId}_${exerciseId}`] = {weight: val, reps: isNaN(reps) ? undefined : reps};
  if (disp) disp.textContent = isNaN(reps) ? '—' : reps;
  btn.textContent = '✓';
  btn.className = 'lift-btn saved';
  showToast('✓ Gespeichert');
  renderOverview();
}

async function toggleSet(weekId, exerciseId, total) {
  const setData = savedSets[`${weekId}_${exerciseId}`] || { doneSets: 0 };
  let next = setData.doneSets >= total ? 0 : setData.doneSets + 1;
  await saveSets(weekId, exerciseId, next, total);
  savedSets[`${weekId}_${exerciseId}`] = { doneSets: next, totalSets: total };
  renderWeek(weekId);
}

// ========== Progress ==========
function renderProgress() {
  const list = document.getElementById('progressList');
  // Group exercises by name (across weeks)
  const exNames = [...new Set(PLAN.weeks.flatMap(w => w.exercises.map(e => e.name.replace(/ –.*/, '').trim())))];
  
  if (exNames.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>Noch keine Übungen vorhanden.</p></div>';
    return;
  }

  list.innerHTML = exNames.map(name => {
    const entries = PLAN.weeks.map(w => {
      const e = w.exercises.find(ex => ex.name.includes(name) || name.includes(ex.name.replace(/ –.*/, '').trim()));
      if (!e) return null;
      const sw = savedWeights[`${w.id}_${e.id}`];
      const wgt = sw?.weight || e.weight || 0;
      return { week: w.id, label: w.label, weight: wgt, saved: sw?.weight != null, ex: e };
    }).filter(Boolean);

    const last = entries[entries.length - 1];
    const first = entries[0];
    const diff = last && first ? (last.weight - first.weight).toFixed(1) : '—';
    const trend = diff > 0 ? '↑' : diff < 0 ? '↓' : '—';
    const trendColor = diff > 0 ? 'var(--primary)' : diff < 0 ? 'var(--red)' : 'var(--text-muted)';

    const dots = entries.map(e => {
      const pct = entries.length > 1 ? ((e.week - 1) / (entries.length - 1)) * 100 : 50;
      const maxW = Math.max(...entries.map(x => x.weight), 1);
      const hgt = (e.weight / maxW) * 100;
      const stored = e.saved ? '' : ' (Plan)';
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;position:relative;height:60px;justify-content:flex-end">
        <div style="position:absolute;top:${100 - hgt}%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text-muted);white-space:nowrap;margin-top:-14px">${e.weight}${e.weight > 0 ? 'kg' : ''}</div>
        <div style="width:60%;height:${hgt}%;border-radius:3px 3px 0 0;background:${e.saved ? 'var(--primary)' : 'var(--green-100)'};min-height:4px;opacity:${e.saved ? 1 : 0.6};cursor:pointer" onclick="showExerciseDetail('${name.replace(/'/g, "\\'")}')"></div>
        <span style="font-size:9px;color:var(--text-muted);margin-top:2px">W${e.week}</span>
      </div>`;
    }).join('');

    return `<div class="progress-item" onclick="showExerciseDetail('${name.replace(/'/g, "\\'")}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="name">${name}</div>
        <div style="font-size:13px;color:${trendColor};font-weight:600">${trend} ${diff !== '—' ? '+' + diff + 'kg' : ''}</div>
      </div>
      <div class="weeks">${dots}</div>
    </div>`;
  }).join('');
}

function showExerciseDetail(name) {
  const modal = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = name;
  const entries = PLAN.weeks.map(w => {
    const e = w.exercises.find(ex => ex.name.includes(name) || name.includes(ex.name.replace(/ –.*/, '').trim()));
    if (!e) return null;
    const sw = savedWeights[`${w.id}_${e.id}`];
    const wgt = sw?.weight || e.weight || 0;
    return { week: w.id, label: w.label, weight: wgt, saved: sw?.weight != null, sets: e.sets, reps: sw?.reps || e.reps };
  }).filter(Boolean);

  const maxW = Math.max(...entries.map(e => e.weight), 1);
  
  document.getElementById('modalContent').innerHTML = entries.map(e => {
    const pct = (e.weight / maxW) * 100;
    return `<div class="bar-row">
      <span class="w-label">${e.label.replace(' (Deload)','').replace(' (Test','')}</span>
      <div class="bar-fill">
        <div style="height:22px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${e.saved ? 'var(--primary)' : 'var(--green-100)'};border-radius:4px;transition:width 0.3s"></div>
        </div>
      </div>
      <span class="w-val">${e.weight}kg</span>
    </div>`;
  }).join('');
  modal.classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

// ========== Reset ==========
async function resetData() {
  if (!confirm('Alle gespeicherten Gewichte zurücksetzen?')) return;
  await resetAllData();
  savedWeights = {};
  savedSets = {};
  trainingInitialized = false;
  render();
  showToast('Daten zurückgesetzt');
}

// ========== Toast ==========
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ========== Init ==========
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

render();
</script>
